# Filtrul fail2ban pentru pluginul WordPress WebGuard2.AI.
#
# Se instaleaza in /etc/fail2ban/filter.d/webguard-ai.conf
#
# Pluginul scrie linii de forma:
#   2026-10-19T08:10:01+00:00 BAN 198.51.100.23 120
#   2026-10-19T08:10:01+00:00 UNBAN 198.51.100.23
# Filtrul marcheaza doar liniile BAN (durata este ignorata; jail-ul foloseste
# bantime=-1, iar durata reala este controlata de plugin + scriptul de sync).

[Definition]
failregex = ^\s+BAN\s+<HOST>(?:\s+\d+)?\s*$
ignoreregex =
datepattern = ^%%Y-%%m-%%dT%%H:%%M:%%S%%z
