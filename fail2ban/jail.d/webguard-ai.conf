# Jail fail2ban pentru pluginul WordPress WebGuard2.AI.
#
# Se instaleaza in /etc/fail2ban/jail.d/webguard-ai.conf
# Adapteaza "logpath" daca instalarea nu este in /var/www/clients/client0/web1
# (calea implicita scrisa de plugin este <radacina contului>/private/webguard-bans.log).
#
# Pluginul decide banurile (whitelist, recidiva, dashboard) si scrie linii
#   "<iso-datetime> BAN <ip> <secunde>"   /   "<iso-datetime> UNBAN <ip>"
# in fisierul de log. Fail2ban citeste acel log si blocheaza IP-ul in kernel
# (nftables), astfel incat cererea sa nu mai ajunga la Apache.
#
# ATENTIE: bantime este -1 (permanent) intentionat. Durata reala este
# controlata de plugin; cron-ul root (webguard-f2b-sync.sh, la fiecare minut)
# ridica banurile expirate/sters/whitelisted si adauga cele active lipsa.

[webguard-ai]
enabled   = true
filter    = webguard-ai
logpath   = /var/www/clients/client0/web1/private/webguard-bans.log
backend   = auto
maxretry  = 1
findtime  = 1h
bantime   = -1
# Nu folosi cresterea exponentiala globala; durata vine din plugin.
bantime.increment = false
port      = http,https
banaction = nftables-multiport[name=webguard-ai]
