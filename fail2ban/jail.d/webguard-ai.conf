# Jail fail2ban pentru pluginul WordPress WebGuard2.AI.
#
# Se instaleaza in /etc/fail2ban/jail.d/webguard-ai.conf
# (instalarea fail2ban si a oricarui jail necesita root o singura data; dupa
# aceea pluginul ruleaza ca orice alt plugin WordPress, fara privilegii.)
#
# Pluginul decide banurile (whitelist, recidiva, dashboard) si scrie linii
#   "<iso-datetime> BAN <ip> <secunde>"   /   "<iso-datetime> UNBAN <ip>"
# intr-un fisier de log. Fail2ban citeste acel log si blocheaza IP-ul in kernel
# (nftables), astfel incat cererea sa nu mai ajunga la Apache.
#
# Pluginul scrie logurile intr-un director dedicat, ales automat in afara
# document root-ului (nepublic). Calea completa o afiseaza Dashboard-ul,
# secțiunea "Integrare fail2ban"; pune-o mai jos la "logpath".

[webguard-ai]
enabled   = true
filter    = webguard-ai
# Exemplu ISPConfig: <radacina contului>/log/webguard/webguard-bans.log.
# Inlocuieste cu calea afisata de plugin in Dashboard.
logpath   = /var/www/clients/client0/web1/log/webguard/webguard-bans.log
backend   = auto
maxretry  = 1
findtime  = 1h

# ---------------------------------------------------------------------------
# MOD SIMPLU (implicit, portabil) - NU are nevoie de root dupa instalare.
# Fail2ban isi gestioneaza singur durata: banul expira automat, iar
# recidivistii primesc durate din ce in ce mai mari (increment).
# ---------------------------------------------------------------------------
bantime   = 1h
bantime.increment    = true
bantime.overalljails = false
#bantime.maxtime     = 30d

# ---------------------------------------------------------------------------
# MOD EXACT (optional, necesita root) - deblocheaza doar daca instalezi si
# scriptul webguard-f2b-sync.sh rulat din cron (root, la fiecare minut).
# Atunci durata banului este EXACT cea hotarata de plugin (trepte de recidiva,
# ban permanent), iar stergerea/whitelist-ul ridica banul instant in kernel.
# In acest mod comenteaza linia "bantime = 1h" de mai sus si foloseste:
# ---------------------------------------------------------------------------
#bantime   = -1
#bantime.increment = false

port      = http,https
banaction = nftables-multiport[name=webguard-ai]
