# WebGuard2.AI - semnatura in access.log
#
# access.log este scris de Apache, nu de plugin. Ca sa poti instrui agentul
# de monitorizare sa ignore cererile blocate de WebGuard, adauga o singura
# data campurile de mai jos la formatul de log folosit de ISPConfig.
#
# Pe acest host, fisierul este /etc/apache2/sites-available/ispconfig.conf.
# Linia existenta arata asa:
#
#   LogFormat "%v %h %l %u %t \"%r\" %>s %O \"%{Referer}i\" \"%{User-Agent}i\"" combined_ispconfig
#
# Inlocuieste-o cu:
#
#   LogFormat "%v %h %l %u %t \"%r\" %>s %O \"%{Referer}i\" \"%{User-Agent}i\" wg=%{WG_BLOCK}e wgp=%{X-WebGuard-Block}o" combined_ispconfig
#
# Apoi valideaza si reincarca:
#
#   apache2ctl configtest && systemctl reload apache2
#
# Rezultat:
#   - cererile blocate in .htaccess au  wg=ban
#   - cererile blocate in PHP au       wgp=ban
#   - cererile normale au              wg=- wgp=-
#
# Agentul de monitorizare trebuie sa ignore liniile care contin:
#
#   wg=ban    sau    wgp=ban
#
# ---------------------------------------------------------------------------
# Alternativa: excluderea completa a cererilor blocate din access.log.
# Adauga "env=!webguard" la CustomLog-ul vlogger (dupa combined_ispconfig):
#
#   CustomLog "| /usr/local/ispconfig/server/scripts/vlogger -s access.log -t \"%Y%m%d-access.log\" /var/log/ispconfig/httpd" combined_ispconfig env=!webguard
#
# In acest caz, cererile blocate de .htaccess nu mai apar deloc in access.log.
# Blocarile facute in PHP raman in log (PHP nu poate seta env-ul Apache sub
# FastCGI), dar au wgp=ban, deci pot fi ignorate dupa semnatura.
#
# Nota: LogFormat/CustomLog sunt setari de server si necesita root o singura
# data. Pluginul nu le modifica singur.
